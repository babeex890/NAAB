<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<title>NAAB 본청 및 부속시설 종합 배치도</title>
<style>
:root{
  --bg:#0d1424; --s1:#141d31; --s2:#1b2640; --line:#26324d;
  --tx:#e8ecf5; --sub:#8d99b3; --amber:#f2b84b; --blue:#7aa2ff;
  --ch:clamp(24px,4.6dvh,42px); --cw:46px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--tx);overflow:hidden;
  font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}

header{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) clamp(12px,2vw,24px) 12px;
  border-bottom:1px solid var(--line);
}
h1{font-size:clamp(1rem,1.6vw,1.25rem);font-weight:700;letter-spacing:-.01em}
header p{font-size:.78rem;color:var(--sub);margin-top:2px}
.legend{display:flex;gap:14px;font-size:.72rem;color:var(--sub);white-space:nowrap}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:0}
.legend .d{border-radius:50%;background:var(--blue)}
.legend .a{border-radius:3px;background:var(--amber)}

main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.8fr);min-height:0}

/* 층 지도 */
.map{
  display:flex;flex-direction:column;justify-content:center;
  gap:clamp(6px,1.6dvh,14px);min-height:0;overflow:auto;
  padding:clamp(12px,2.2dvh,24px) clamp(12px,2vw,24px);
}
.grp{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:center}
.grp h2{font-size:.78rem;font-weight:600;color:var(--sub);line-height:1.3;padding-left:9px;border-left:3px solid var(--g)}
.grp .s{display:none}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:4px}
.chip{
  position:relative;height:var(--ch);border:1px solid var(--line);border-radius:7px;
  background:var(--s1);color:var(--tx);font-size:.78rem;font-weight:600;
  font-variant-numeric:tabular-nums;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.chip:hover{border-color:var(--blue);background:var(--s2)}
.chip:focus-visible,.nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chip.on{background:var(--amber);border-color:var(--amber);color:#1a1405;box-shadow:0 0 0 3px rgba(242,184,75,.22)}
.chip .dot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.chip.on .dot{background:#1a1405}

/* 상세 패널 */
.detail{
  background:var(--s1);border-left:1px solid var(--line);min-height:0;overflow:auto;
  display:flex;flex-direction:column;gap:clamp(10px,2dvh,18px);
  padding:clamp(14px,2.4dvh,26px) clamp(14px,2vw,26px) calc(clamp(14px,2.4dvh,26px) + env(safe-area-inset-bottom));
}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.big{font-size:clamp(2rem,6dvh,3rem);font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub{margin-top:6px;font-size:.85rem;color:var(--sub)}
.tag{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:.78rem;padding:3px 10px;border-radius:99px;background:var(--s2);border:1px solid var(--line)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--g)}
.nav{display:flex;gap:6px;flex:none}
.nav button{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--s2);color:var(--tx);font-size:.8rem;cursor:pointer}
.nav button:hover:not(:disabled){border-color:var(--blue)}
.nav button:disabled{opacity:.35;cursor:default}
.unit h3{font-size:.82rem;font-weight:600;color:var(--blue);margin-bottom:7px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{font-size:.86rem;padding:5px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:#cfd6e6}
.pf-title{font-size:.8rem;color:var(--sub);margin-bottom:8px}
.pf{display:flex;gap:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pf+.pf{margin-top:8px}
.pf.many{padding:10px;gap:12px}
.pf.many .ph{width:72px;height:72px}
.pf.many .pi p{margin-bottom:6px}
.ph{width:96px;height:96px;aspect-ratio:1/1;flex:none;align-self:flex-start;border-radius:9px;overflow:hidden;background:var(--s2);display:grid;place-items:center;font-size:1.6rem;font-weight:700;color:var(--sub)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pi{min-width:0;flex:1}
.pi b{font-size:1.1rem}
.pi p{font-size:.78rem;line-height:1.4;color:var(--blue);margin:3px 0 10px}
.pi dl{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.pi dt{font-size:.68rem;color:var(--sub)}
.pi dd{font-size:.84rem}
.pi .w{grid-column:1/-1}
.none{font-size:.82rem;color:var(--sub)}

/* 폰 */
@media (max-width:760px){
  :root{--cw:36px;--ch:clamp(26px,4dvh,30px)}
  header{padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
  header p,.legend .a{display:none}
  main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .map{justify-content:flex-start;gap:7px;padding:10px 12px;overflow:visible}
  .grp{grid-template-columns:58px minmax(0,1fr);gap:8px}
  .grp h2{font-size:.68rem;padding-left:6px}
  .grp .n{display:none}
  .grp .s{display:inline}
  .chips{gap:3px}
  .chip{font-size:.7rem;border-radius:6px}
  .detail{border-left:0;border-top:1px solid var(--line);padding:12px 12px calc(12px + env(safe-area-inset-bottom));gap:10px}
  .big{font-size:1.8rem}
  .ph{width:64px;height:64px}
  .pf{padding:10px;gap:10px}
  .pf.many .ph{width:56px;height:56px}
  .pi p{margin-bottom:6px}
}

/* 4명 이상: 2열 압축 카드 */
.pfs.dense{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pfs.dense .pf-title{grid-column:1/-1;margin-bottom:2px}
.pfs.dense .pf{flex-direction:column;gap:6px;padding:8px;margin:0}
.pfs.dense .ph{width:44px;height:44px;font-size:1rem}
.pfs.dense .pi b{font-size:.9rem}
.pfs.dense .pi p{font-size:.68rem;margin:2px 0 5px}
.pfs.dense .pi dl{display:flex;flex-wrap:wrap;gap:1px 8px}
.pfs.dense .pi dt{display:none}
.pfs.dense .pi dd{font-size:.72rem;color:#cfd6e6}
.pfs.dense .pi .w{flex-basis:100%}

/* 탭 및 로고 */
[hidden]{display:none!important}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;flex:none;border-radius:8px;background:#f1f4fa;display:grid;place-items:center;overflow:hidden;color:#33405c;font-weight:800}
.logo img{width:100%;height:100%;object-fit:contain;padding:3px;display:block}
.logo{--lh:52px;width:auto;height:var(--lh);aspect-ratio:3/2}
.logo.sq{aspect-ratio:1/1}
.logo.r54{aspect-ratio:1.5/1.2}
.logo.xl{--lh:104px;border-radius:12px;font-size:1.6rem}
.legend{margin-left:auto}
.tabs{display:flex;gap:4px;padding:3px;background:var(--s1);border:1px solid var(--line);border-radius:11px;flex:none}
.tabs button{border:0;background:transparent;color:var(--sub);font-weight:600;font-size:.82rem;padding:7px 14px;border-radius:8px;cursor:pointer}
.tabs button:hover{color:var(--tx)}
.tabs button[aria-selected=true]{background:var(--amber);color:#1a1405}
.tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ICAA */
.legend em{font-style:normal}
#imap{justify-content:flex-start}
.chip.t{height:auto;min-height:var(--ch);padding:5px 8px;line-height:1.25;font-size:.76rem}
#imap .chips{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.info{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--s1);font-size:.78rem;line-height:1.5;color:var(--sub)}
.info b{display:block;color:var(--tx);font-size:.9rem;margin-bottom:2px}
.info span{display:block}
.big.t{font-size:clamp(1.4rem,3.8dvh,1.9rem);line-height:1.2}

/* 국가기관 */
.fld{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.fld .unit.full{grid-column:1/-1}
.fld .unit p{font-size:.92rem;line-height:1.5}
@media (max-width:760px){#imap .chips{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}.grp.ig{grid-template-columns:64px minmax(0,1fr)}.tabs button{font-size:.72rem;padding:7px 4px}.fld{gap:10px 12px}}

/* 세계 10대 기업 */
.map.corp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(72px,12.5dvh,100px);align-content:center;gap:10px}
.tile{display:flex;align-items:center;gap:12px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--s1);color:var(--tx);text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.tile .logo{--lh:clamp(56px,10dvh,80px)}
.tile .tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.tile b{font-size:.92rem;line-height:1.25}
.tile small{font-size:.74rem;color:var(--sub)}
.tile em{font-style:normal;font-size:.72rem;color:var(--sub);font-variant-numeric:tabular-nums;align-self:flex-start}
.tile:hover{border-color:var(--blue);background:var(--s2)}
.tile.on{border-color:var(--amber);background:var(--s2);box-shadow:0 0 0 2px rgba(242,184,75,.25)}
.tile.on em{color:var(--amber)}
.tile:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ch{display:flex;align-items:center;gap:12px;min-width:0}
.rk{font-size:.78rem;color:var(--amber);font-weight:700;font-variant-numeric:tabular-nums}
.cn{font-size:clamp(1.3rem,3.2dvh,1.7rem);font-weight:800;line-height:1.15;letter-spacing:-.01em}
.lead{font-size:.95rem;line-height:1.55}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px;font-size:.78rem}
.chain span{padding:4px 10px;border-radius:99px;border:1px solid var(--blue);color:var(--blue)}
.chain i{font-style:normal;color:var(--sub)}
.detail > .tag{align-self:flex-start;margin-top:0}
@media (max-width:760px){
  .bt,.legend{display:none}
  header{gap:10px}
  .tabs{flex:1}
  .tabs button{flex:1;padding:7px 6px;font-size:.8rem}
  .map.corp{grid-auto-rows:68px;gap:6px;align-content:start}
  .tile{padding:6px 8px;gap:8px;border-radius:10px}
  .tile .logo{--lh:52px}
  .tile b{font-size:.76rem}
  .tile small{font-size:.66rem}
  .tile em{display:none}
  .brand .logo{--lh:42px}
  .logo.xl{--lh:72px;font-size:1.2rem}
  .cn{font-size:1.2rem}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="logo sq" id="hlogo"><img data-id="Cf64duD" alt="NAAB"></span>
      <span class="logo sq" id="hlogo2" hidden><img data-id="NGvHL6N" alt="ICAA"></span>
      <div class="bt">
        <h1 id="h1">NAAB 본청 층별 배치</h1>
        <p id="sub">층별 배치 및 담당 간부 현황</p>
      </div>
    </div>
    <div class="legend" id="legend">
      <span><i class="d"></i><em id="lg1">간부 프로필</em></span>
      <span class="a"><i class="a"></i><em id="lg2">선택한 층</em></span>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="floors" aria-selected="true">층별 배치</button>
      <button type="button" role="tab" data-tab="corp" aria-selected="false">세계 10대 기업</button>
      <button type="button" role="tab" data-tab="org" aria-selected="false">국가기관</button>
      <button type="button" role="tab" data-tab="icaa" aria-selected="false">ICAA</button>
    </div>
  </header>
  <main id="p-floors">
    <nav class="map" id="map" aria-label="층 선택"></nav>
    <section class="detail" id="detail" aria-live="polite"></section>
  </main>
  <main id="p-corp" hidden>
    <nav class="map corp" id="cmap" aria-label="기업 선택"></nav>
    <section class="detail" id="cdetail" aria-live="polite"></section>
  </main>
  <main id="p-icaa" hidden>
    <nav class="map" id="imap" aria-label="ICAA 직위 선택"></nav>
    <section class="detail" id="idetail" aria-live="polite"></section>
  </main>
  <main id="p-org" hidden>
    <nav class="map corp" id="omap" aria-label="기관 선택"></nav>
    <section class="detail" id="odetail" aria-live="polite"></section>
  </main>
</div>

const map = $('#map'), detail = $('#detail');
const btns = [];
let cur = 0;

G.forEach(g => {

function show(i) {
  cur = i;
  const f = F[i];
  btns.forEach((b, j) => {
    b.classList.toggle('on', j === i);
    b.setAttribute('aria-pressed', j === i);
  });

  const k = f.d.indexOf(': ');
  const unit = k > -1 ? f.d.slice(0, k) : '';
  const items = (k > -1 ? f.d.slice(k + 2) : f.d).split(', ');

  detail.style.setProperty('--g', f.g.c);
  detail.innerHTML = `
    <div class="dh">

        <div class="big">${f.id}</div>

              <div class="w"><dt>능력/등급</dt><dd>${p.ability}</dd></div>
              ${p.note ? `<div class="w"><dt>${p.noteLabel || '특이사항'}</dt><dd>${p.note}</dd></div>` : ''}
            </dl>
          </div>
        </div>`).join('') : '<div class="none">등록된 담당 간부가 없습니다.</div>'}

}

detail.addEventListener('click', e => {

});

function setTab(t) {
  tab = t;
  for (const k in mains) mains[k].hidden = k !== t;

  $('#h1').textContent = TT[t][0];

  $('#legend').hidden = t !== 'floors' && t !== 'icaa';
  $('#lg1').textContent = t === 'icaa' ? '인물 프로필' : '간부 프로필';

  $('#hlogo').hidden = t !== 'floors';
  $('#hlogo2').hidden = t !== 'icaa';
  try { history.replaceState(null, '', '#' + t); } catch (e) {}
}

    org: [ocur, O.length, oshow, obtns],
    icaa: [icur, IF.length, ishow, ibtns]

  if (n < 0 || n >= st[1]) return;
  e.preventDefault();
  st[2](n);
  st[3][n].focus({ preventScroll: true });
});
