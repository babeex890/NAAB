<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<title>NAAB 본청 및 부속시설 종합 배치도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#0d1424; --s1:#141d31; --s2:#1b2640; --line:#26324d;
  --tx:#e8ecf5; --sub:#8d99b3; --amber:#f2b84b; --blue:#7aa2ff;
  --ch:clamp(24px,4.6dvh,42px); --cw:46px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--tx);overflow:hidden;
  font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}

header{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) clamp(12px,2vw,24px) 12px;
  border-bottom:1px solid var(--line);
}
h1{font-size:clamp(1rem,1.6vw,1.25rem);font-weight:700;letter-spacing:-.01em}
header p{font-size:.78rem;color:var(--sub);margin-top:2px}
.legend{display:flex;gap:14px;font-size:.72rem;color:var(--sub);white-space:nowrap}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:0}
.legend .d{border-radius:50%;background:var(--blue)}
.legend .a{border-radius:3px;background:var(--amber)}

main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.8fr);min-height:0}

/* 층 지도 */
.map{
  display:flex;flex-direction:column;justify-content:center;
  gap:clamp(6px,1.6dvh,14px);min-height:0;overflow:auto;
  padding:clamp(12px,2.2dvh,24px) clamp(12px,2vw,24px);
}
.grp{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:center}
.grp h2{font-size:.78rem;font-weight:600;color:var(--sub);line-height:1.3;padding-left:9px;border-left:3px solid var(--g)}
.grp .s{display:none}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:4px}
.chip{
  position:relative;height:var(--ch);border:1px solid var(--line);border-radius:7px;
  background:var(--s1);color:var(--tx);font-size:.78rem;font-weight:600;
  font-variant-numeric:tabular-nums;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.chip:hover{border-color:var(--blue);background:var(--s2)}
.chip:focus-visible,.nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chip.on{background:var(--amber);border-color:var(--amber);color:#1a1405;box-shadow:0 0 0 3px rgba(242,184,75,.22)}
.chip .dot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.chip.on .dot{background:#1a1405}

/* 상세 패널 */
.detail{
  background:var(--s1);border-left:1px solid var(--line);min-height:0;overflow:auto;
  display:flex;flex-direction:column;gap:clamp(10px,2dvh,18px);
  padding:clamp(14px,2.4dvh,26px) clamp(14px,2vw,26px) calc(clamp(14px,2.4dvh,26px) + env(safe-area-inset-bottom));
}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.big{font-size:clamp(2rem,6dvh,3rem);font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub{margin-top:6px;font-size:.85rem;color:var(--sub)}
.tag{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:.78rem;padding:3px 10px;border-radius:99px;background:var(--s2);border:1px solid var(--line)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--g)}
.nav{display:flex;gap:6px;flex:none}
.nav button{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--s2);color:var(--tx);font-size:.8rem;cursor:pointer}
.nav button:hover:not(:disabled){border-color:var(--blue)}
.nav button:disabled{opacity:.35;cursor:default}
.unit h3{font-size:.82rem;font-weight:600;color:var(--blue);margin-bottom:7px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{font-size:.86rem;padding:5px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:#cfd6e6}
.pf-title{font-size:.8rem;color:var(--sub);margin-bottom:8px}
.pf{display:flex;gap:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pf+.pf{margin-top:8px}
.pf.many{padding:10px;gap:12px}
.pf.many .ph{width:72px;height:72px}
.pf.many .pi p{margin-bottom:6px}
.ph{width:96px;height:96px;aspect-ratio:1/1;flex:none;align-self:flex-start;border-radius:9px;overflow:hidden;background:var(--s2);display:grid;place-items:center;font-size:1.6rem;font-weight:700;color:var(--sub)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pi{min-width:0;flex:1}
.pi b{font-size:1.1rem}
.pi p{font-size:.78rem;line-height:1.4;color:var(--blue);margin:3px 0 10px}
.pi dl{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.pi dt{font-size:.68rem;color:var(--sub)}
.pi dd{font-size:.84rem}
.pi .w{grid-column:1/-1}
.none{font-size:.82rem;color:var(--sub)}

/* 폰 */
@media (max-width:760px){
  :root{--cw:36px;--ch:clamp(26px,4dvh,30px)}
  header{padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
  header p,.legend .a{display:none}
  main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .map{justify-content:flex-start;gap:7px;padding:10px 12px;overflow:visible}
  .grp{grid-template-columns:58px minmax(0,1fr);gap:8px}
  .grp h2{font-size:.68rem;padding-left:6px}
  .grp .n{display:none}
  .grp .s{display:inline}
  .chips{gap:3px}
  .chip{font-size:.7rem;border-radius:6px}
  .detail{border-left:0;border-top:1px solid var(--line);padding:12px 12px calc(12px + env(safe-area-inset-bottom));gap:10px}
  .big{font-size:1.8rem}
  .ph{width:64px;height:64px}
  .pf{padding:10px;gap:10px}
  .pf.many .ph{width:56px;height:56px}
  .pi p{margin-bottom:6px}
}

/* 4명 이상: 2열 압축 카드 */
.pfs.dense{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pfs.dense .pf-title{grid-column:1/-1;margin-bottom:2px}
.pfs.dense .pf{flex-direction:column;gap:6px;padding:8px;margin:0}
.pfs.dense .ph{width:44px;height:44px;font-size:1rem}
.pfs.dense .pi b{font-size:.9rem}
.pfs.dense .pi p{font-size:.68rem;margin:2px 0 5px}
.pfs.dense .pi dl{display:flex;flex-wrap:wrap;gap:1px 8px}
.pfs.dense .pi dt{display:none}
.pfs.dense .pi dd{font-size:.72rem;color:#cfd6e6}
.pfs.dense .pi .w{flex-basis:100%}

/* 탭 및 로고 */
[hidden]{display:none!important}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;flex:none;border-radius:8px;background:#f1f4fa;display:grid;place-items:center;overflow:hidden;color:#33405c;font-weight:800}
.logo img{width:100%;height:100%;object-fit:contain;padding:3px;display:block}
.logo{--lh:52px;width:auto;height:var(--lh);aspect-ratio:3/2}
.logo.sq{aspect-ratio:1/1}
.logo.r54{aspect-ratio:1.5/1.2}
.logo.xl{--lh:104px;border-radius:12px;font-size:1.6rem}
.legend{margin-left:auto}
.tabs{display:flex;gap:4px;padding:3px;background:var(--s1);border:1px solid var(--line);border-radius:11px;flex:none}
.tabs button{border:0;background:transparent;color:var(--sub);font-weight:600;font-size:.82rem;padding:7px 14px;border-radius:8px;cursor:pointer}
.tabs button:hover{color:var(--tx)}
.tabs button[aria-selected=true]{background:var(--amber);color:#1a1405}
.tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ICAA */
.legend em{font-style:normal}
#imap{justify-content:flex-start}
.chip.t{height:auto;min-height:var(--ch);padding:5px 8px;line-height:1.25;font-size:.76rem}
#imap .chips{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.info{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--s1);font-size:.78rem;line-height:1.5;color:var(--sub)}
.info b{display:block;color:var(--tx);font-size:.9rem;margin-bottom:2px}
.info span{display:block}
.big.t{font-size:clamp(1.4rem,3.8dvh,1.9rem);line-height:1.2}

/* 국가기관 */
.fld{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.fld .unit.full{grid-column:1/-1}
.fld .unit p{font-size:.92rem;line-height:1.5}
@media (max-width:760px){#imap .chips{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}.grp.ig{grid-template-columns:64px minmax(0,1fr)}.tabs button{font-size:.72rem;padding:7px 4px}.fld{gap:10px 12px}}

/* 세계 10대 기업 */
.map.corp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(72px,12.5dvh,100px);align-content:center;gap:10px}
.tile{display:flex;align-items:center;gap:12px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--s1);color:var(--tx);text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.tile .logo{--lh:clamp(56px,10dvh,80px)}
.tile .tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.tile b{font-size:.92rem;line-height:1.25}
.tile small{font-size:.74rem;color:var(--sub)}
.tile em{font-style:normal;font-size:.72rem;color:var(--sub);font-variant-numeric:tabular-nums;align-self:flex-start}
.tile:hover{border-color:var(--blue);background:var(--s2)}
.tile.on{border-color:var(--amber);background:var(--s2);box-shadow:0 0 0 2px rgba(242,184,75,.25)}
.tile.on em{color:var(--amber)}
.tile:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ch{display:flex;align-items:center;gap:12px;min-width:0}
.rk{font-size:.78rem;color:var(--amber);font-weight:700;font-variant-numeric:tabular-nums}
.cn{font-size:clamp(1.3rem,3.2dvh,1.7rem);font-weight:800;line-height:1.15;letter-spacing:-.01em}
.lead{font-size:.95rem;line-height:1.55}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px;font-size:.78rem}
.chain span{padding:4px 10px;border-radius:99px;border:1px solid var(--blue);color:var(--blue)}
.chain i{font-style:normal;color:var(--sub)}
.detail > .tag{align-self:flex-start;margin-top:0}
@media (max-width:760px){
  .bt,.legend{display:none}
  header{gap:10px}
  .tabs{flex:1}
  .tabs button{flex:1;padding:7px 6px;font-size:.8rem}
  .map.corp{grid-auto-rows:68px;gap:6px;align-content:start}
  .tile{padding:6px 8px;gap:8px;border-radius:10px}
  .tile .logo{--lh:52px}
  .tile b{font-size:.76rem}
  .tile small{font-size:.66rem}
  .tile em{display:none}
  .brand .logo{--lh:42px}
  .logo.xl{--lh:72px;font-size:1.2rem}
  .cn{font-size:1.2rem}
}

/* 거주지 */
#hmap{padding:0;overflow:hidden;position:relative;display:block;min-height:280px}
#hmapc{position:absolute;inset:0;background:var(--s1)}
.hmsg{position:absolute;z-index:500;left:12px;bottom:12px;right:12px;padding:8px 12px;border-radius:9px;background:var(--s2);border:1px solid var(--line);font-size:.76rem;color:var(--sub)}
.leaflet-container{font-family:inherit;background:var(--s1)}
.leaflet-tooltip.nt{background:var(--s2);color:var(--tx);border:1px solid var(--line);font-weight:600;font-size:.78rem;box-shadow:none}
.leaflet-tooltip-top.nt:before{border-top-color:var(--line)}
.pin{width:30px;height:30px;border-radius:50%;background:var(--blue);border:2px solid #fff;color:#0d1424;font-weight:800;font-size:.8rem;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .15s}
.pin.on{background:var(--amber);transform:scale(1.25);box-shadow:0 0 0 5px rgba(242,184,75,.3),0 2px 8px rgba(0,0,0,.5)}
.pin.hq{border-radius:8px;background:#c08bff;color:#fff}
.pin.co{border-radius:8px;background:#3fd0a0;color:#0d1424}
.golink{align-self:flex-start;border:1px solid var(--line);background:var(--s2);color:var(--tx);font-size:.8rem;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer}
.golink:hover{border-color:var(--blue)}
.golink:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--s2);color:var(--tx)}
.subbtn{display:block;background:#fff;color:#222;border:2px solid rgba(0,0,0,.25);border-radius:5px;padding:6px 12px;font-weight:700;font-size:.78rem;cursor:pointer;font-family:inherit;box-shadow:none}
.subbtn.on{background:var(--amber);border-color:var(--amber);color:#1a1405}
.addr{margin-top:8px;font-size:.84rem;line-height:1.5;color:#cfd6e6}
.hlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px}
.hlist .chip{height:auto;min-height:32px;padding:5px 6px;font-size:.76rem}
@media (max-width:760px){
  main#p-home{grid-template-rows:42dvh minmax(0,1fr)}
  #hmap{min-height:0}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="logo sq" id="hlogo"><img data-id="Cf64duD" alt="NAAB"></span>
      <span class="logo sq" id="hlogo2" hidden><img data-id="NGvHL6N" alt="ICAA"></span>
      <div class="bt">
        <h1 id="h1">NAAB 본청 층별 배치</h1>
        <p id="sub">층별 배치 및 담당 간부 현황</p>
      </div>
    </div>
    <div class="legend" id="legend">
      <span><i class="d"></i><em id="lg1">간부 프로필</em></span>
      <span class="a"><i class="a"></i><em id="lg2">선택한 층</em></span>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="floors" aria-selected="true">층별 배치</button>
      <button type="button" role="tab" data-tab="corp" aria-selected="false">세계 10대 기업</button>
      <button type="button" role="tab" data-tab="org" aria-selected="false">국가기관</button>
      <button type="button" role="tab" data-tab="icaa" aria-selected="false">ICAA</button>
      <button type="button" role="tab" data-tab="home" aria-selected="false">거주지</button>
    </div>
  </header>
  <main id="p-floors">
    <nav class="map" id="map" aria-label="층 선택"></nav>
    <section class="detail" id="detail" aria-live="polite"></section>
  </main>
  <main id="p-corp" hidden>
    <nav class="map corp" id="cmap" aria-label="기업 선택"></nav>
    <section class="detail" id="cdetail" aria-live="polite"></section>
  </main>
  <main id="p-icaa" hidden>
    <nav class="map" id="imap" aria-label="ICAA 직위 선택"></nav>
    <section class="detail" id="idetail" aria-live="polite"></section>
  </main>
  <main id="p-home" hidden>
    <nav class="map" id="hmap" aria-label="거주지 지도"><div id="hmapc"></div></nav>
    <section class="detail" id="hdetail" aria-live="polite"></section>
  </main>
  <main id="p-org" hidden>
    <nav class="map corp" id="omap" aria-label="기관 선택"></nav>
    <section class="detail" id="odetail" aria-live="polite"></section>
  </main>
</div>

<script>
const G = [
  { s:"옥상", n:"옥상", c:"#8a94ab", f:[
    ["RF","통신시설, 헬리패드, 기상관측장비, 안테나, 위성통신시설","RF 옥상시설관리실"]
  ]},
  { s:"지휘", n:"고위직 및 통합지휘구역", c:"#c08bff", f:[
    ["45F","통합상황실, 비상지휘센터, 보안통제실, 전국통합관제실"],
    ["44F","청장실, 비서실, 보좌실, 고위급 접견실"],
    ["43F","부청장실, 국장회의실, 대회의실, 중앙회의지원실"],
    ["42F","국장 및 부국장 집무실"]
  ]},
  { s:"정보통계", n:"정보통계국", c:"#5aa9ff", f:[
    ["41F","법무실: 행정쟁송팀, 법률자문팀, 법무실장실"],
    ["40F","법무실: 권리보호과, 권리심사팀, 실무 간부진 전용 라운지"],
    ["39F","법무실: 법령검토팀, 행정제도팀"],
    ["38F","국제첩보실: 정보분석팀, 데이터품질팀, 국제첩보실장실"],
    ["37F","국제첩보실: 해외정보팀, 국제협력팀, 암호통신실"],
    ["36F","수사과: 검거팀, 증거관리팀"],
    ["35F","수사과: 디지털수사팀, 추적팀, 수사과장실"],
    ["34F","수사과: 특별수사팀, 불법능력수사팀"],
    ["33F","감찰실: 청렴조사과, 감찰후속관리팀"],
    ["32F","감찰실: 감찰1팀, 감찰2팀, 감찰실장실"]
  ]},
  { s:"자산보호", n:"자산보호국", c:"#3fd0a0", f:[
    ["31F","기획과: 제도개선팀, 정책개발팀, 기획과장실"],
    ["30F","기획과: 성과평가팀, 업무조정팀, 실내정원"],
    ["29F","기획과: 조직관리팀, 조직기획팀"],
    ["28F","총무과: 물자관리팀, 차량지원팀, 총무과장실"],
    ["27F","총무과: 자원관리팀, 행정지원팀"],
    ["26F","총무과: 청사관리팀, 문서행정팀"],
    ["25F","인사과: 교육관리팀, 교육훈련팀, 대형휴게실"],
    ["24F","인사과: 복무팀, 감평사관리팀, 인사과장실"],
    ["23F","인사과: 인사운영팀, 인사팀"],
    ["22F","재무과: 회계팀, 감사지원팀, 재무과장실"],
    ["21F","재무과: 예산집행팀, 계약관리팀"],
    ["20F","재무과: 예산팀, 예산기획팀"]
  ]},
  { s:"감정관리", n:"감정관리국", c:"#e58fd0", f:[
    ["19F","자산등록과: 이력관리팀, 자산이력팀, 자산등록과장실"],

const F = G.flatMap(g => g.f.map(([id, d, name, chip]) => ({ id, d, name: name || id, chip: chip || id, g })));
const $ = s => document.querySelector(s);
const map = $('#map'), detail = $('#detail');
const btns = [];
let cur = 0;

G.forEach(g => {
  const sec = document.createElement('section');
  sec.className = 'grp';
  sec.style.setProperty('--g', g.c);
  sec.innerHTML = `<h2><span class="s">${g.s}</span><span class="n">${g.n}</span></h2><div class="chips"></div>`;
  const box = sec.querySelector('.chips');
  F.forEach((f, i) => {
    if (f.g !== g) return;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = f.chip;
    b.title = f.name;
    if (P[f.id]) b.insertAdjacentHTML('beforeend', '<i class="dot"></i>');
    b.onclick = () => show(i);
    btns[i] = b;
    box.appendChild(b);
  });
  map.appendChild(sec);
});

function show(i) {
  cur = i;
  const f = F[i];
  btns.forEach((b, j) => {
    b.classList.toggle('on', j === i);
    b.setAttribute('aria-pressed', j === i);
  });

  const k = f.d.indexOf(': ');
  const unit = k > -1 ? f.d.slice(0, k) : '';
  const items = (k > -1 ? f.d.slice(k + 2) : f.d).split(', ');
  const pr = P[f.id] || [];

  detail.style.setProperty('--g', f.g.c);
  detail.innerHTML = `
    <div class="dh">
      <div>
        <div class="big">${f.id}</div>
        ${f.name !== f.id ? `<div class="sub">${f.name}</div>` : ''}
        <span class="tag">${f.g.n}</span>
      </div>
      <div class="nav">
        <button type="button" data-go="-1" aria-label="위층" ${i === 0 ? 'disabled' : ''}>▲</button>
        <button type="button" data-go="1" aria-label="아래층" ${i === F.length - 1 ? 'disabled' : ''}>▼</button>
      </div>
    </div>
    <div class="unit">
      ${unit ? `<h3>${unit}</h3>` : ''}
      <div class="pills">${items.map(t => `<span>${t}</span>`).join('')}</div>
    </div>
    <div class="pfs${pr.length >= 4 ? ' dense' : ''}">
      <div class="pf-title">소속 간부</div>
      ${pr.length ? pr.map(p => `
        <div class="pf${pr.length > 1 ? ' many' : ''}">
          <div class="ph"><img src="${p.image}" alt="${p.name}" referrerpolicy="no-referrer"></div>
          <div class="pi">
            <b>${p.name}</b>
            <p>${p.position}</p>
            <dl>
              ${p.gender ? `<div><dt>성별</dt><dd>${p.gender}</dd></div>` : ''}
              <div><dt>나이</dt><dd>${p.age}</dd></div>
              <div class="w"><dt>체격</dt><dd>${p.height} / ${p.weight}</dd></div>
              <div class="w"><dt>능력/등급</dt><dd>${p.ability}</dd></div>
              ${p.note ? `<div class="w"><dt>${p.noteLabel || '특이사항'}</dt><dd>${p.note}</dd></div>` : ''}
            </dl>
          </div>
        </div>`).join('') : '<div class="none">등록된 담당 간부가 없습니다.</div>'}
    </div>`;

  detail.querySelectorAll('.ph img').forEach(im => {
    im.onerror = () => { im.parentNode.textContent = im.alt.charAt(0); };
  });
}

detail.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (!b) return;
  const n = cur + Number(b.dataset.go);
  if (n >= 0 && n < F.length) show(n);
});

function loadImg(im) {
  const id = im.dataset.id, list = [];
  ['no-referrer', ''].forEach(rp => ['.png', '.jpg', '.webp', ''].forEach(e => list.push([`https://i.imgur.com/${id}${e}`, rp])));
  let n = 0;
  const next = () => {
    if (n >= list.length) { im.parentNode.textContent = im.alt.charAt(0); return; }
    const [u, rp] = list[n++];
    im.referrerPolicy = rp;
    im.src = u;
  };
  im.onerror = next;
  next();
}

  subLines = L.layerGroup();
  subDots = L.layerGroup();
  const st = new Map();
  SUB.forEach(l => l.s.forEach(seg => {
    L.polyline(seg.map(q => [q[1], q[2]]), { color: l.c, weight: 3.5, opacity: .9, interactive: false }).addTo(subLines);
    seg.forEach(q => {
      const o = st.get(q[0]) || { p: [q[1], q[2]], ls: [] };
      if (!o.ls.includes(l.n)) o.ls.push(l.n);
      st.set(q[0], o);
    });
  }));
  st.forEach((o, name) => {
    const first = SUB.find(l => l.n === o.ls[0]);
    L.circleMarker(o.p, { radius: o.ls.length > 1 ? 4.5 : 3.2, color: first.c, weight: 2, fillColor: '#0d1424', fillOpacity: 1 })
      .bindTooltip(`${name}역 · ${o.ls.join(', ')}`, { direction: 'top', offset: [0, -6], className: 'nt' })
      .addTo(subDots);
  });
}
function subRefresh() {
  if (!hm) return;
  if (!subLines) subBuild();
  const on = subOn, dots = subOn && hm.getZoom() >= 13;
  [[subLines, on], [subDots, dots]].forEach(([g, v]) => {
    if (v && !hm.hasLayer(g)) g.addTo(hm);
    if (!v && hm.hasLayer(g)) hm.removeLayer(g);
  });
}
const SubCtl = window.L ? L.Control.extend({
  options: { position: 'topright' },
  onAdd() {
    const b = L.DomUtil.create('button', 'subbtn');
    b.type = 'button';
    b.textContent = '지하철 OFF';
    L.DomEvent.disableClickPropagation(b);
    b.onclick = () => {
      subOn = !subOn;
      b.textContent = '지하철 ' + (subOn ? 'ON' : 'OFF');
      b.classList.toggle('on', subOn);
      subRefresh();
    };
    return b;
  }
}) : null;

function hinit() {
  if (!window.L) {
    if (!$('#hmap .hmsg')) $('#hmap').insertAdjacentHTML('beforeend', '<div class="hmsg">지도 라이브러리(Leaflet)를 불러오지 못했습니다. 인터넷 연결 또는 외부 스크립트 차단 여부를 확인해 주세요.</div>');
    return;
  }
  if (!hm) {
    hm = L.map('hmapc', { zoomControl: true, maxZoom: 19 });
    const esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
    const dark = L.layerGroup([
      L.tileLayer(esri + 'Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, maxNativeZoom: 16, attribution: 'Tiles © Esri' }),
      L.tileLayer(esri + 'Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, maxNativeZoom: 16 })
    ]);
    const sat = L.layerGroup([
      L.tileLayer(esri + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, maxNativeZoom: 17, attribution: 'Imagery © Esri' }),
      L.tileLayer(esri + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, maxNativeZoom: 17 })
    ]);
    const osmfr = L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
      subdomains: 'abc', maxZoom: 19, attribution: '© OpenStreetMap contributors'
    });
    dark.addTo(hm);
    L.control.layers({ '다크': dark, '위성 사진': sat, '상세 지도(OSM)': osmfr }, null, { position: 'topright' }).addTo(hm);
    new SubCtl().addTo(hm);
    hm.on('zoomend', subRefresh);
    H.forEach((h, i) => {
      hmk[i] = L.marker([h[2], h[3]], { icon: pin(h[0], i === hcur), title: h[0] })
        .addTo(hm)
        .bindTooltip(h[0], { direction: 'top', offset: [0, -16], className: 'nt' })
        .on('click', () => hshow(i, true));
    });
    K.forEach(k => {
      L.marker([k[2], k[3]], { icon: L.divIcon({ className: '', html: `<div class="pin hq">${k[4]}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] }), title: k[0] })
        .addTo(hm)
        .bindTooltip(k[0], { direction: 'top', offset: [0, -16], className: 'nt' })
        .bindPopup(`<b>${k[0]}</b><br>${k[1]}`);
    });
    CL.forEach((c, i) => {
      cmk[i] = L.marker([c[2], c[3]], { icon: L.divIcon({ className: '', html: `<div class="pin co">${C[i][0].charAt(0)}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] }), title: clabel(i) })
        .addTo(hm)
        .bindTooltip(clabel(i), { direction: 'top', offset: [0, -16], className: 'nt' })
        .bindPopup(`<b>${clabel(i)}</b><br>${c[1] || c[0]}`);
    });
    hm.fitBounds(L.latLngBounds(H.map(h => [h[2], h[3]])), { padding: [50, 50], maxZoom: 12 });
  }
  setTimeout(() => hm.invalidateSize(), 0);
}

function cgo(i) {
  setTab('home');
  if (!hm) return;
  setTimeout(() => {
    hm.invalidateSize();
    hm.flyTo([CL[i][2], CL[i][3]], 16, { duration: .6 });
    hm.once('moveend', () => cmk[i].openPopup());
  }, 60);
}

function hshow(i, fly) {
  hcur = i;
  const [name, addr, lat, lng] = H[i];
  const q = findP(name);
  const region = addr.split(' ').slice(0, 2).join(' ');
  if (hm) {
    hmk.forEach((m, j) => m.setIcon(pin(H[j][0], j === i)));
    if (fly) hm.flyTo([lat, lng], Math.max(hm.getZoom(), 17), { duration: .6 });
  }
  hdetail.style.setProperty('--g', 'var(--amber)');
  hdetail.innerHTML = `
    <div class="dh">
      <div>
        <div class="big t">${name}</div>
        <span class="tag">${region}</span>
        <div class="addr">${addr}</div>
      </div>
    </div>
    <div class="pfs">
      <div class="pf-title">인물 정보</div>
      ${q ? `
      <div class="pf">
        <div class="ph"><img src="${q.image}" alt="${q.name}" referrerpolicy="no-referrer"></div>
        <div class="pi">
          <b>${q.name}</b>
          <p>${q.position}</p>
          <dl>
            ${q.gender ? `<div><dt>성별</dt><dd>${q.gender}</dd></div>` : ''}
            <div><dt>나이</dt><dd>${q.age}</dd></div>
            <div class="w"><dt>체격</dt><dd>${q.height} / ${q.weight}</dd></div>
            <div class="w"><dt>능력/등급</dt><dd>${q.ability}</dd></div>
          </dl>
        </div>
      </div>` : '<div class="none">등록된 프로필이 없습니다.</div>'}
    </div>
    <div class="unit">
      <h3>거주지 등록 인물 (${H.length})</h3>
      <div class="hlist">${H.map((h, j) => `<button type="button" class="chip${j === i ? ' on' : ''}" data-h="${j}">${h[0]}</button>`).join('')}</div>
    </div>`;
  hdetail.querySelectorAll('.ph img').forEach(im => {
    im.onerror = () => { im.parentNode.textContent = im.alt.charAt(0); };
  });
}
hdetail.addEventListener('click', e => {
  const b = e.target.closest('[data-h]');
  if (b) hshow(Number(b.dataset.h), true);
});

/* ---------- 탭 ---------- */
const mains = { floors: $('#p-floors'), corp: $('#p-corp'), org: $('#p-org'), icaa: $('#p-icaa'), home: $('#p-home') };
const TT = {
  floors: ["NAAB 본청 층별 배치", "층별 배치 및 담당 간부 현황"],
  corp: ["세계 10대 기업", "기업별 국가·위상·조직 라인업"],
  org: ["국가기관", "국가별 관리 기관 현황"],
  icaa: ["ICAA", "국제 캐피터 감정 이사회 및 산하 조직 현황"],
  home: ["거주지", "서울·경기·인천 캐릭터 거주지 및 주요 시설·기업 거점 현황"]
};
let tab = 'floors';
function setTab(t) {
  tab = t;
  for (const k in mains) mains[k].hidden = k !== t;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  $('#h1').textContent = TT[t][0];
  $('#sub').textContent = TT[t][1];
  $('#legend').hidden = t !== 'floors' && t !== 'icaa';
  $('#lg1').textContent = t === 'icaa' ? '인물 프로필' : '간부 프로필';
  $('#lg2').textContent = t === 'icaa' ? '선택한 직위' : '선택한 층';
  $('#hlogo').hidden = t !== 'floors';
  $('#hlogo2').hidden = t !== 'icaa';
  if (t === 'home') hinit();
  try { history.replaceState(null, '', '#' + t); } catch (e) {}
}
document.querySelectorAll('.tabs button').forEach(b => { b.onclick = () => setTab(b.dataset.tab); });
fixLogos(document.querySelector('header'));

addEventListener('keydown', e => {
  const d = { ArrowUp: -1, ArrowLeft: -1, ArrowDown: 1, ArrowRight: 1 }[e.key];
  if (!d) return;
  const st = {
    floors: [cur, F.length, show, btns],
    corp: [ccur, C.length, cshow, cbtns],
    org: [ocur, O.length, oshow, obtns],
    icaa: [icur, IF.length, ishow, ibtns]
  }[tab];
  if (!st) return;
  const n = st[0] + d;
  if (n < 0 || n >= st[1]) return;
  e.preventDefault();
  st[2](n);
  st[3][n].focus({ preventScroll: true });
});

show(F.findIndex(f => f.id === "22F"));
cshow(0);
oshow(0);
ishow(IF.findIndex(x => x.name === '최고감정관'));
hshow(0);
setTab(['corp', 'org', 'icaa', 'home'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'floors');
</script>
